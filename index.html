<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メールのたつじん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EE; --card:#FFFFFF; --ink:#3B3330; --sub:#8C8079; --line:#F2E3D3;
  --mikan:#FF9F43; --mikan-dark:#F0872A; --mikan-light:#FFE4C7;
  --leaf:#7BC47F; --leaf-dark:#5FA964; --leaf-light:#E3F4E4;
  --sky:#9ED8F5; --sky-light:#E6F5FD;
  --pink:#FF8FA8; --pink-light:#FFE1E8;
  --shadow:0 10px 28px rgba(240,135,42,.13);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(circle at 10% 10%, #FFF0DE 0, transparent 35%), radial-gradient(circle at 90% 20%, #EAF7FF 0, transparent 30%), radial-gradient(circle at 70% 90%, #EEF8EE 0, transparent 30%);
  color:var(--ink); line-height:1.65; min-height:100vh;
}
a{color:var(--mikan-dark)}
button{font-family:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;max-width:1040px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.02em}
.brand .mini{width:36px;height:36px}
.topbar .right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;color:var(--ink);font-size:13px;white-space:nowrap}
.chip.demo{background:var(--sky-light);border-color:var(--sky)}
.linkbtn{background:none;border:none;color:var(--sub);cursor:pointer;text-decoration:underline;font-size:13px}
main{max-width:1040px;margin:0 auto;padding:6px 22px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;border:2px solid #fff}
.card.soft{background:#FFFDFA}
h1{font-size:26px;margin:0 0 6px;font-weight:800}
h2{font-size:19px;margin:0 0 10px;font-weight:800}
h3{font-size:15px;margin:0 0 6px;font-weight:800;color:var(--mikan-dark)}
p{margin:0 0 8px}
.muted{color:var(--sub);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 24px;font-weight:800;font-size:16px;cursor:pointer;transition:transform .08s ease, box-shadow .2s;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.primary{background:var(--mikan);color:#fff;box-shadow:0 6px 0 var(--mikan-dark)}
.btn.primary:active{box-shadow:0 2px 0 var(--mikan-dark)}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-dark)}
.btn.leaf:active{box-shadow:0 2px 0 var(--leaf-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.btn.ghost:active{box-shadow:0 2px 0 var(--line)}
.btn.small{padding:8px 16px;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.hidden{display:none !important}

/* ---------- login ---------- */
.login-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;margin-top:30px}
.login-hero{text-align:center}
.login-hero .char{width:220px;margin:0 auto}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;display:inline-block;max-width:360px;text-align:left;font-size:15px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--line)}
.bubble.left:after{left:-12px;bottom:auto;top:22px;transform:none;border:6px solid transparent;border-right-color:var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:800;font-size:13px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#FFFDFA;color:var(--ink);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mikan)}
.err{background:var(--pink-light);color:#B5324F;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;margin-top:10px}

/* ---------- persona ---------- */
.persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.persona-card{cursor:pointer;border:3px solid var(--line);border-radius:22px;padding:18px;text-align:center;background:#fff;transition:transform .12s, border-color .12s}
.persona-card:hover{transform:translateY(-4px);border-color:var(--mikan)}
.persona-card .avatar{width:96px;height:96px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px}
.persona-card .name{font-weight:800;font-size:20px}

/* ---------- home / map ---------- */
.home-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.progress{height:16px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--leaf),#A6DBA8);border-radius:999px;transition:width .5s}
.map{width:100%;height:auto;display:block}
.map .node{cursor:pointer}
.map .node.locked{cursor:default}
.map text{font-family:inherit}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:18px}
.step-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.step-card.locked{opacity:.55}
.step-card .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--mikan-light);color:var(--mikan-dark);font-weight:800}
.step-card.passed .num{background:var(--leaf-light);color:var(--leaf-dark)}
.step-card .title{font-weight:800;font-size:15px}
.status{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;display:inline-block}
.status.open{background:var(--mikan-light);color:var(--mikan-dark)}
.status.passed{background:var(--leaf-light);color:var(--leaf-dark)}
.status.failed{background:var(--pink-light);color:#B5324F}
.status.locked{background:#F1ECE6;color:var(--sub)}
.step-card .btn{margin-top:auto}

/* ---------- step ---------- */
.step-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.mail{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.mail .mailbar{background:#FFF1E2;padding:10px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--mikan-dark)}
.mail .mailbar .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:#FFC48A}
.mail .line{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding:8px 16px}
.mail .line label{width:48px;font-weight:800;font-size:13px;color:var(--sub);flex:none}
.mail .line input{flex:1;border:none;font-family:inherit;font-size:16px;padding:6px 4px;outline:none;background:transparent;color:var(--ink)}
.mail .to{flex:1;font-weight:700;background:var(--sky-light);border-radius:8px;padding:4px 10px;font-size:14px}
.mail textarea{width:100%;border:none;resize:vertical;min-height:360px;padding:14px 16px;font-family:inherit;font-size:16px;line-height:1.7;outline:none;color:var(--ink)}
.mail .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#FFFDFA;border-top:2px solid var(--line);flex-wrap:wrap}
.side .card{margin-bottom:14px}
.incoming{background:var(--sky-light);border:2px solid var(--sky);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.points{list-style:none;padding:0;margin:0}
.points li{position:relative;padding-left:26px;margin-bottom:6px;font-size:14px}
.points li:before{content:"✓";position:absolute;left:4px;top:0;color:var(--leaf-dark);font-weight:800}
.char-side{display:flex;gap:10px;align-items:flex-start}
.char-side .char{width:74px;flex:none}
.persona-info{font-size:14px;line-height:1.8}
.persona-info b{color:var(--mikan-dark)}
.req{background:var(--mikan-light);border-radius:14px;padding:10px 14px;font-size:13px}
.req ul{margin:4px 0 0;padding-left:18px}

/* ---------- result ---------- */
.result-head{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.stamp{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;transform:rotate(-8deg);border:5px solid;letter-spacing:.05em;text-align:center;line-height:1.2}
.stamp.pass{color:var(--leaf-dark);border-color:var(--leaf-dark);background:var(--leaf-light)}
.stamp.fail{color:#B5324F;border-color:#E07A93;background:var(--pink-light)}
.total{font-size:46px;font-weight:800;line-height:1}
.total small{font-size:18px;color:var(--sub)}
.items{display:grid;gap:10px;margin-top:16px}
.item{border:2px solid var(--line);border-radius:16px;padding:12px 16px;background:#fff}
.item .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item .name{font-weight:800;font-size:16px}
.dots{display:inline-flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;background:#EFE6DC;display:inline-block}
.dots i.on{background:var(--mikan)}
.item .comment{font-size:14px;color:var(--sub);margin-top:4px}
.ded{margin:8px 0 0;padding:0;list-style:none}
.ded li{font-size:14px;background:#FFF8F2;border-radius:10px;padding:8px 10px;margin-top:6px}
.ded .q{display:inline-block;background:var(--pink-light);color:#B5324F;border-radius:6px;padding:0 6px;font-weight:700;margin-right:6px}
.ded .pt{font-weight:800;color:#B5324F;margin-right:6px}
.tips{margin:8px 0 0;padding-left:22px}
.tips li{margin-bottom:4px;font-weight:700}
.warn{background:#FFF4D6;border:2px solid #F7D27A;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;margin-top:12px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:800;color:var(--mikan-dark)}
pre.submit{white-space:pre-wrap;background:#FFFDFA;border:2px dashed var(--line);border-radius:14px;padding:14px;font-family:inherit;font-size:13px;max-height:320px;overflow:auto}

/* ---------- overlay / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(255,247,238,.88);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.overlay .box{text-align:center}
.overlay .char{width:150px;margin:0 auto;animation:bob 1.4s ease-in-out infinite}
.overlay .msg{font-weight:800;font-size:18px;margin-top:8px}
.overlay .sub{font-size:13px;color:var(--sub)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}70%{transform:scale(1.1) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.stamp{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .login-wrap,.step-layout,.persona-grid{grid-template-columns:1fr}
  .result-head{grid-template-columns:1fr;text-align:center;justify-items:center}
  .home-head{grid-template-columns:1fr}
  main{padding:6px 14px 50px}
  .card{padding:18px}
  .topbar{padding:10px 14px}
  .brand{font-size:17px}
  .brand .mini{width:30px;height:30px}
}
</style>
</head>

const nl2br = (s) => esc(s).replace(/\n/g, '<br>');
function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }
function sstore(key, val) { try { if (val === undefined) return JSON.parse(sessionStorage.getItem(key)); sessionStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

async function api(action, data) {
  if (S.demo) return demoApi(action, data);
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, data)),
    redirect: 'follow',
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error('サーバーの応答を読み取れませんでした'); }
  if (!json.ok) throw new Error(json.error || 'エラーが発生しました');
  return json;
}

// ---------- デモモード ----------
function demoApi(action, data) {
  return new Promise((resolve, reject) => setTimeout(() => {
    try {
      if (action === 'login') {
        resolve({ ok: true, config: DEMO_CONFIG, tasks: DEMO_TASKS, progress: store('demo_progress_' + data.cls + '_' + data.num) || {} });
      } else if (action === 'grade') {
        const task = DEMO_TASKS.find((t) => t.step === Number(data.step));
        const key = 'demo_progress_' + data.cls + '_' + data.num;
        const prog = store(key) || {};
        const p = prog[data.step] || (prog[data.step] = { attempts: 0, best: 0, passed: false });
        if (task.maxAttempts && p.attempts >= task.maxAttempts) { reject(new Error('このステップはもう提出済みです。結果は「見返す」から確認できます。')); return; }
        const r = demoGrade(data);
        p.attempts++; p.best = Math.max(p.best, r.result.total); p.passed = p.passed || r.result.pass;
        p.last = { timestamp: r.timestamp, persona: data.persona, subject: data.subject, body: data.body, result: r.result, maxTotal: r.maxTotal, code: r.code, submitText: r.submitText };
        store(key, prog);
        r.progress = prog;
        resolve(r);
      } else reject(new Error('unknown'));
    } catch (e) { reject(e); }
  }, action === 'grade' ? 1800 : 400));
}

function demoGrade(d) {
  const task = DEMO_TASKS.find((t) => t.step === Number(d.step));
  const body = d.body, subject = d.subject;
  // ステップ4（確認テスト）の採点にも使う。学生には見せない必須要素をここで補う
  const hiddenReq = { 4: [['企画書', '決定事項（企画書初稿）の確認'], ['2週間', '期限（2週間後）'], ['ありがとう', '時間をとってもらったことへのお礼']] };
  const items = [];
  const mk = (name) => ({ name, max: 5, score: 5, deductions: [], comment: '' });
  const cut = (it, quote, points, reason) => { it.score = Math.max(0, it.score - points); it.deductions.push({ quote, points, reason }); };

  const m = mk('マナー・配慮');
  if (!/(恐れ入り|恐縮|お手数|お忙しい|幸いです|いただけ|いただき|いただけます)/.test(body)) cut(m, '', 2, 'クッション言葉や相手の都合を気づかう表現がありません。「お忙しいところ恐れ入りますが」などを入れましょう。');
  if (/ください[。！]?$/m.test(body) && !/いただけ/.test(body)) cut(m, 'ください', 1, '「〜ください」だけでは一方的な印象です。「〜いただけますでしょうか」と相手に委ねる形に。');
  const dateCount = (body.match(/\d+月\d+日|\d+日\s*[（(]?[月火水木金土日]|[月火水木金]曜/g) || []).length;
  if (task.step <= 3 && dateCount < 2) cut(m, '', 1, '候補日時は2つ以上、相手が選びやすい形で示しましょう。');
  m.comment = m.score >= 4 ? '相手への配慮はできています。' : '相手本位の言い回しをもう一段。';
  items.push(m);

  const e = mk('日本語表現');
  [['了解しました', '目上には「承知いたしました」を使います。'], ['ご苦労様', '目上には「お疲れ様です」。「ご苦労様」は目下向けです。'], ['お伺いさせていただ', '二重敬語です。「伺います」で十分。'], ['拝見させていただ', '二重敬語です。「拝見します」で十分。'], ['おられ', '「いらっしゃる」が自然です。'], ['させていただきます', '多用は避け、「いたします」に。']].forEach(([w, why]) => { if (body.includes(w)) cut(e, w, 1, why); });
  if (/だ。|である。/.test(body)) cut(e, 'だ。', 1, '文体が「だ・である」になっています。「です・ます」に統一を。');
  e.comment = e.score >= 4 ? '敬語はおおむね正確です。' : '敬語の基本を確認しましょう。';
  items.push(e);

  const f = mk('形式');
  if (subject.length < 4) cut(f, subject, 1, '件名だけで用件がわかるようにしましょう。');
  const first = body.split('\n').map((l) => l.trim()).filter(Boolean)[0] || '';
  if (!/(様|部長|さん|御中)/.test(first)) cut(f, first.slice(0, 20), 1, '最初の行は宛名です。役職や「様」を付けましょう。');
  if (!/(さくらじま|桜島)/.test(body.slice(0, Math.min(body.length, 200)))) cut(f, '', 1, '冒頭で所属と名前を名乗りましょう。');
  if (!/よろしくお願い/.test(body)) cut(f, '', 1, '結びの挨拶（よろしくお願いいたします）がありません。');
  const tail = body.split('\n').filter((l) => l.trim()).slice(-3).join('\n');
  if (!/桜島/.test(tail)) cut(f, '', 1, '末尾に署名（会社名・部署・名前）を入れましょう。');
  f.comment = f.score >= 4 ? '形式は整っています。' : 'メールの型（宛名→名乗り→用件→結び→署名）を守りましょう。';
  items.push(f);

  const a = mk('正確さ');
  const reqs = { 1: [['30分', '所要時間（30分程度）']], 2: [['田中', '田中部長が同行する旨']], 3: [], 4: hiddenReq[4] }[task.step] || [];
  reqs.forEach(([w, label]) => { if (!body.includes(w)) cut(a, '', 2, '必須要素「' + label + '」が入っていません。'); });
  if (body.length < 80) cut(a, '', 1, '本文が短すぎて、必要な情報が足りません。');
  a.comment = a.score >= 4 ? '必要な情報は入っています。' : '課題の必須要素を確認しましょう。';
  items.push(a);

  const total = items.reduce((s, x) => s + x.score, 0);
  const pass = total >= DEMO_CONFIG.pass_score;
  const result = {
    items, total, pass,
    summary: (pass ? '合格ラインは超えています。' : 'まだ送れる水準ではありません。') + '（デモモードの簡易チェックです。本番ではAIが敬語や文脈まで細かく見ます）',
    tips: items.filter((x) => x.deductions.length).slice(0, 3).map((x) => x.deductions[0].reason.split('。')[0] + '。'),
    flags: { injection: /採点者|満点に/.test(body), personal_info: false },
  };
  const now = new Date();
  const ts = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const code = 'DEMO' + String(Math.floor(Math.random() * 9000) + 1000);
  const submitText = buildSubmitTextClient(task, d, result, 20, ts, code);
  return { ok: true, result, maxTotal: 20, code, timestamp: ts, submitText };
}

function buildSubmitTextClient(task, d, result, maxTotal, ts, code) {
  const L = [];
  L.push('【ビジネスメール練習 提出】（デモ）');
  L.push('クラス：' + d.cls + '　番号：' + d.num + '　なりきり：' + d.persona);
  L.push('ステップ：' + task.step + '　' + task.title);
  L.push('得点：' + result.total + ' / ' + maxTotal + '（' + (result.pass ? '合格' : '不合格') + '）');
  L.push('提出日時：' + ts);
  L.push('照合コード：' + code);
  L.push('――――― 送信したメール ―――――');
  L.push('宛先：' + task.to); L.push('件名：' + d.subject); L.push(''); L.push(d.body);
  L.push('――――― 採点 ―――――');
  result.items.forEach((it) => {
    L.push(it.name + '　' + it.score + '/' + it.max + (it.comment ? '　' + it.comment : ''));
    it.deductions.forEach((x) => L.push('　・' + (x.points ? '−' + x.points + '　' : '') + (x.quote ? '「' + x.quote + '」 ' : '') + x.reason));
  });
  L.push('講評：' + result.summary);
  if (result.tips.length) { L.push('次に直すこと：'); result.tips.forEach((t, i) => L.push('　' + (i + 1) + '. ' + t)); }
  return L.join('\n');
}

// ---------- ホーム（マップ） ----------
// 状態: locked / open / passed / failed（再挑戦できる） / done（提出済みで再挑戦不可）
function taskOf(step) { return S.tasks.find((t) => t.step === step); }
function attemptsLeft(step) {
  const t = taskOf(step); const p = S.progress[step] || { attempts: 0 };
  if (!t || !t.maxAttempts) return Infinity;
  return Math.max(0, t.maxAttempts - p.attempts);
}
function stepState(step) {
  const p = S.progress[step] || { attempts: 0, best: 0, passed: false };
  const idx = S.tasks.findIndex((t) => t.step === step);
  const prev = idx > 0 ? S.progress[S.tasks[idx - 1].step] : null;
  const unlocked = idx === 0 || (prev && prev.attempts > 0);
  if (!unlocked) return 'locked';
  if (p.passed) return 'passed';
  if (p.attempts > 0) return attemptsLeft(step) > 0 ? 'failed' : 'done';
  return 'open';
}
function currentStep() {
  for (const t of S.tasks) { const st = stepState(t.step); if (st === 'open' || st === 'failed') return t.step; }
  return S.tasks.length ? S.tasks[S.tasks.length - 1].step : 1;
}
const STATE_LABEL = { open: 'チャレンジできる', passed: '合格', failed: 'もう少し', done: '提出済み', locked: 'まだ開かない' };

function mapSVG() {
  const n = S.tasks.length;
  const W = Math.max(760, 150 * n + 60), H = 240;
  const xs = S.tasks.map((_, i) => 80 + i * ((W - 160) / Math.max(1, n - 1)));
  const ys = S.tasks.map((_, i) => (i % 2 === 0 ? 160 : 110));
  let s = '<svg class="map" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  // path
  for (let i = 0; i < n - 1; i++) {
    const x1 = xs[i], y1 = ys[i], x2 = xs[i + 1], y2 = ys[i + 1], mx = (x1 + x2) / 2;
    const walked = (S.progress[S.tasks[i].step] || {}).attempts > 0;
    s += '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" fill="none" stroke="' + (walked ? '#7BC47F' : '#E7DED5') + '" stroke-width="8" stroke-linecap="round"' + (walked ? '' : ' stroke-dasharray="2 14"') + '/>';
  }
  const cur = currentStep();
  S.tasks.forEach((t, i) => {
    const st = stepState(t.step);
    const x = xs[i], y = ys[i];
    const p = S.progress[t.step] || {};
    let fill = '#fff', stroke = '#FF9F43', tcol = '#F0872A', inner = String(t.step);
    if (st === 'locked') { fill = '#EFE8E0'; stroke = '#E7DED5'; tcol = '#B9ADA3'; }
    if (st === 'failed') { fill = '#FFE1E8'; stroke = '#FF8FA8'; tcol = '#B5324F'; }
    if (st === 'done') { fill = '#E6F5FD'; stroke = '#9ED8F5'; tcol = '#2E7FA6'; inner = '✓'; }
    if (st === 'passed') { fill = '#7BC47F'; stroke = '#5FA964'; tcol = '#fff'; inner = '✓'; }
    const badgeBg = st === 'passed' ? '#E3F4E4' : st === 'done' ? '#E6F5FD' : '#FFE1E8';
    const badgeFg = st === 'passed' ? '#5FA964' : st === 'done' ? '#2E7FA6' : '#B5324F';
    s += '<g class="node ' + st + '" data-step="' + t.step + '">';
    if (t.isTest) s += '<text x="' + x + '" y="' + (y - 40) + '" text-anchor="middle" font-size="11" font-weight="800" fill="#B5324F">確認テスト</text>';
    s += '<circle cx="' + x + '" cy="' + y + '" r="30" fill="' + fill + '" stroke="' + stroke + '" stroke-width="5"' + (t.isTest ? ' stroke-dasharray="6 4"' : '') + '/>';
    s += '<text x="' + x + '" y="' + (y + 8) + '" text-anchor="middle" font-size="22" font-weight="800" fill="' + tcol + '">' + inner + '</text>';
    if (p.attempts > 0) {
      s += '<rect x="' + (x - 26) + '" y="' + (y + 38) + '" width="52" height="20" rx="10" fill="' + badgeBg + '"/>';
      s += '<text x="' + x + '" y="' + (y + 52) + '" text-anchor="middle" font-size="12" font-weight="800" fill="' + badgeFg + '">' + p.best + '/20</text>';
    }
    const shortTitle = t.title.replace(/^確認テスト[：:]/, '');
    s += '<text x="' + x + '" y="' + (y + 76) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + (st === 'locked' ? '#B9ADA3' : '#3B3330') + '">' + esc(shortTitle.length > 13 ? shortTitle.slice(0, 12) + '…' : shortTitle) + '</text>';
    s += '</g>';
    if (t.step === cur) {
      const allDone = S.tasks.every((tt) => (S.progress[tt.step] || {}).attempts > 0);
      s += '<g transform="translate(' + (x - 34) + ' ' + (y - (t.isTest ? 120 : 102)) + ')"><foreignObject width="68" height="68"><div xmlns="http://www.w3.org/1999/xhtml" style="width:68px;height:68px;animation:bob 1.6s ease-in-out infinite">' + charSVG(allDone ? 'happy' : 'normal', 68) + '</div></foreignObject></g>';
    }
  });
  s += '</svg>';
  return s;
}

function renderHome() {
  const n = S.tasks.length;
  const done = S.tasks.filter((t) => (S.progress[t.step] || {}).attempts > 0).length;
  const passed = S.tasks.filter((t) => stepState(t.step) === 'passed').length;
  const allDone = n > 0 && done === n;
  const cur = currentStep();
  const curTask = taskOf(cur);
  const curState = stepState(cur);
  let msg;
  if (allDone) msg = passed === n ? 'ぜんぶ合格！おめでとう🎉 メールのたつじんだね。' : '全ステップ提出おつかれさま！ 結果はいつでも「見返す」から読み返せるよ。';
  else if (curState === 'failed') msg = 'ステップ' + cur + 'は、もう少し！ 指摘を直してもう一度送ろう。';
  else if (done === 0) msg = 'まずはステップ1から。' + (curTask ? '「' + curTask.title + '」' : '') + 'に挑戦しよう！';
  else if (curTask && curTask.isTest) msg = '最後は確認テスト。ヒントなしで、これまでの練習を思い出して書こう。';
  else msg = '次は ステップ' + cur + (curTask ? '「' + curTask.title + '」' : '') + ' だよ。';

  const cards = S.tasks.map((t) => {
    const st = stepState(t.step); const p = S.progress[t.step] || {};
    const label = STATE_LABEL[st] + (p.attempts ? ' ' + p.best + '/20' : '');
    let btn = '';
    if (st === 'open') btn = '<button class="btn primary small" onclick="openStep(' + t.step + ')">はじめる</button>';
    else if (st === 'failed') btn = '<button class="btn leaf small" onclick="openStep(' + t.step + ')">再挑戦する</button>';
    else if (st === 'passed' || st === 'done') btn = '<button class="btn ghost small" onclick="renderReview(' + t.step + ')">結果を見返す</button>';
    const note = t.maxAttempts ? '提出は' + t.maxAttempts + '回まで' : '合格するまで何度でも';
    return '<div class="step-card ' + st + '"><div class="row" style="gap:8px"><span class="num">' + t.step + '</span><span class="status ' + st + '">' + esc(label) + '</span></div><div class="title">' + esc(t.title) + '</div>' +
      '<div class="muted">' + (st === 'locked' ? '前のステップを送ると開きます' : note) + (p.attempts ? '　｜　提出 ' + p.attempts + ' 回' : '') + '</div>' + btn + '</div>';
  }).join('');

  render(
    '<div class="home-head">' +
      '<div><h1>' + esc(S.persona) + 'のメール修行</h1>' +
        '<div class="bubble">' + esc(msg) + '</div>' +
      '</div>' +
      '<div class="card soft" style="min-width:240px"><div class="muted">提出したステップ</div><div class="total">' + done + '<small> / ' + n + '</small></div><div class="progress"><div style="width:' + (n ? (done / n) * 100 : 0) + '%"></div></div><div class="muted" style="margin-top:6px">' + (allDone ? '修了！（合格 ' + passed + ' / ' + n + '）' : '修了まであと ' + (n - done) + ' ステップ') + '</div></div>' +
    '</div>' +
    '<div class="card">' + mapSVG() + '</div>' +
    '<div class="steps">' + cards + '</div>'
  );
  document.querySelectorAll('.map .node').forEach((g) => {
    g.addEventListener('click', () => {
      const step = Number(g.getAttribute('data-step'));
      const st = stepState(step);
      if (st === 'locked') toast('前のステップを先に送ってね');
      else if (st === 'passed' || st === 'done') renderReview(step);
      else openStep(step);
    });
  });
}

// ---------- ステップ画面 ----------
function openStep(step) {
  const t = taskOf(step);
  if (!t) return;
  const st = stepState(step);
  if (st === 'locked') { toast('前のステップを先に送ってね'); return; }
  if (st === 'passed' || st === 'done') { renderReview(step); return; }
  S.current = t;
  const c = S.config;
  const draft = store('draft_' + S.cls + '_' + S.num + '_' + step) || {};
  const left = attemptsLeft(step);
  const leftText = left === Infinity ? '合格するまで何度でも提出できます' : (left === 1 ? '提出できるのは1回だけ。送る前によく見直そう' : 'あと ' + left + ' 回提出できます');
  const pointsCard = t.isTest
    ? '<div class="card"><div class="char-side"><div class="char">' + charSVG('think') + '</div><div><h3>確認テスト</h3><p style="font-size:14px">ここではポイント解説はありません。ステップ1〜' + (t.step - 1) + 'で学んだ「宛名・名乗り・用件・結び・署名」と敬語を、自分の力で全部使って書こう。</p></div></div></div>'
    : '<div class="card"><div class="char-side"><div class="char">' + charSVG('normal') + '</div><div><h3>' + esc(c.character_name) + 'のポイント</h3><ul class="points">' + t.points.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul></div></div></div>';
  render(
    '<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost small" onclick="renderHome()">◀ マップにもどる</button><span class="status ' + (t.isTest ? 'failed' : st) + '">' + (t.isTest ? '確認テスト' : st === 'failed' ? '再挑戦' : '初挑戦') + '</span></div>' +
    '<div class="card soft" style="margin-bottom:16px"><div class="muted">ステップ ' + t.step + '</div><h1>' + esc(t.title) + '</h1><p>' + esc(t.situation) + '</p>' +
      (t.required.length ? '<div class="req"><b>必ず入れること</b><ul>' + t.required.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul></div>' : '') +
      '<p class="muted" style="margin:8px 0 0">' + esc(leftText) + '</p></div>' +
    '<div class="step-layout">' +
      '<div>' +
        (t.incoming ? '<div class="card" style="margin-bottom:14px"><h3>📩 相手から届いたメール</h3><div class="incoming">' + esc(t.incoming) + '</div></div>' : '') +
        '<div class="mail">' +
          '<div class="mailbar"><span class="dots"><span></span><span></span><span></span></span>新規メッセージ</div>' +
          '<div class="line"><label>宛先</label><span class="to">' + esc(t.to) + '</span></div>' +
          '<div class="line"><label>件名</label><input id="inSubject" placeholder="用件がわかる件名を" value="' + esc(draft.subject || '') + '" autocomplete="off"></div>' +
          '<textarea id="inBody" placeholder="ここに本文を書きます。宛名 → 名乗り → 用件 → 結び → 署名 の順が基本です。">' + esc(draft.body || '') + '</textarea>' +
          '<div class="foot"><span class="muted" id="count">0 文字</span><button class="btn primary" id="btnSend">✉ 送信して採点してもらう</button></div>' +
        '</div>' +
        '<p class="muted" style="margin-top:8px">※ 本文への貼り付けはできません。自分の手で書いてね。</p>' +
      '</div>' +
      '<div class="side">' +
        pointsCard +
        '<div class="card"><h3>あなたの設定（署名に使ってOK）</h3><div class="persona-info">' +
          '<b>' + esc(S.persona.slice(0, 2)) + ' ' + esc(S.persona.slice(2)) + '</b><br>' + esc(c.company_name) + '　' + esc(c.company_dept) + '（' + esc(c.persona_role) + '）<br>' +
          'TEL：' + esc(c.signature_tel) + '<br>メール：' + esc(c.signature_mail) + '<br>住所：' + esc(c.signature_address) + '</div>' +
          '<div class="muted" style="margin-top:6px">上司：' + esc(c.boss_title) + '　' + esc(c.boss_name) + '<br>取引先：' + esc(c.client_company) + '　' + esc(c.client_title) + '　' + esc(c.client_name) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  const body = $('#inBody'), subj = $('#inSubject'), count = $('#count');
  const block = (e) => { e.preventDefault(); toast('貼り付けはできません。自分で入力してね ✍'); };
  [body, subj].forEach((el) => { el.addEventListener('paste', block); el.addEventListener('drop', block); });
  const update = () => { count.textContent = body.value.length + ' 文字'; store('draft_' + S.cls + '_' + S.num + '_' + step, { subject: subj.value, body: body.value }); };
  body.addEventListener('input', update); subj.addEventListener('input', update); update();
  $('#btnSend').onclick = () => submitMail(t, subj.value, body.value);
  if (!draft.subject) subj.focus();
}

const LOADING_MSGS = ['読んでいます…', '敬語をチェック中…', '宛名と署名を確認中…', '必須要素を数えています…', 'もう少し…'];
let loadingTimer;
function showLoading(on) {
  const ov = $('#overlay');
  clearInterval(loadingTimer);
  if (!on) { ov.classList.add('hidden'); return; }
  $('#overlayChar').innerHTML = charSVG('think');
  let i = 0; $('#overlayMsg').textContent = S.config.character_name + 'が' + LOADING_MSGS[0];
  loadingTimer = setInterval(() => { i = (i + 1) % LOADING_MSGS.length; $('#overlayMsg').textContent = S.config.character_name + 'が' + LOADING_MSGS[i]; }, 2500);
  ov.classList.remove('hidden');
}

let sending = false;
async function submitMail(t, subject, body) {
  if (sending) return;
  subject = subject.trim(); body = body.trim();
  if (!subject) { toast('件名を入れてね'); $('#inSubject').focus(); return; }
  if (body.length < 30) { toast('本文が短すぎます'); $('#inBody').focus(); return; }
  const left = attemptsLeft(t.step);
  if (left === 1) {
    const ok = window.confirm('このステップは1回しか提出できません。\n送ったあとは書き直せません。この内容で送信しますか？');
    if (!ok) return;
  }
  sending = true;
  $('#btnSend').disabled = true;
  showLoading(true);
  try {
    const res = await api('grade', { cls: S.cls, num: S.num, persona: S.persona, step: t.step, subject, body });
    S.progress = res.progress || S.progress;
    try { localStorage.removeItem('draft_' + S.cls + '_' + S.num + '_' + t.step); } catch (e) {}
    showLoading(false);
    renderResult(Object.assign({ task: t, subject, body }, res), false);
  } catch (e) {
    showLoading(false);
    const b = $('#btnSend'); if (b) b.disabled = false;
    toast('エラー: ' + e.message);
  } finally {
    sending = false;
  }
}

// ---------- 見返し ----------
function renderReview(step) {
  const t = taskOf(step);
  const p = S.progress[step];
  if (!t || !p || !p.last) { toast('まだ提出していません'); renderHome(); return; }
  const L = p.last;
  renderResult({ task: t, subject: L.subject, body: L.body, result: L.result, maxTotal: L.maxTotal || 20, code: L.code, timestamp: L.timestamp, submitText: L.submitText }, true);
}

// ---------- 結果 ----------
function renderResult(R, review) {
  const r = R.result, t = R.task, c = S.config;
  const left = attemptsLeft(t.step);
  const canRetry = !r.pass && left > 0;
  const items = r.items.map((it) => {
    const dots = Array.from({ length: it.max }, (_, i) => '<i class="' + (i < it.score ? 'on' : '') + '"></i>').join('');
    const ded = it.deductions.length ? '<ul class="ded">' + it.deductions.map((d) => '<li>' + (d.points ? '<span class="pt">−' + d.points + '</span>' : '') + (d.quote ? '<span class="q">' + esc(d.quote) + '</span>' : '') + esc(d.reason) + '</li>').join('') + '</ul>' : '';
    return '<div class="item"><div class="top"><span class="name">' + esc(it.name) + '</span><span class="row" style="gap:8px"><span class="dots">' + dots + '</span><b>' + it.score + '/' + it.max + '</b></span></div>' + (it.comment ? '<div class="comment">' + esc(it.comment) + '</div>' : '') + ded + '</div>';
  }).join('');
  const mailBlock = '<details' + (review ? ' open' : '') + '><summary>送ったメールを見る</summary><div class="incoming" style="margin-top:8px;background:#FFFDFA;border-color:var(--line)">' + '件名：' + esc(R.subject) + '\n\n' + esc(R.body) + '</div></details>';
  render(
    '<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost small" onclick="renderHome()">◀ マップにもどる</button>' + (review ? '<span class="status done">提出済みの結果（' + esc(R.timestamp || '') + '）</span>' : '') + '</div>' +
    '<div class="card">' +
      '<div class="result-head">' +
        '<div class="stamp ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '合格！' : 'もう<br>少し！') + '</div>' +
        '<div><div class="muted">ステップ ' + t.step + '　' + esc(t.title) + '</div><div class="total">' + r.total + '<small> / ' + R.maxTotal + '点</small></div><div class="muted">合格ラインは ' + c.pass_score + ' 点　｜　照合コード ' + esc(R.code) + '</div></div>' +
        '<div style="width:110px">' + charSVG(r.pass ? 'happy' : 'sad') + '</div>' +
      '</div>' +
      '<div class="bubble" style="display:block;max-width:none;margin-top:14px"><b>' + esc(c.character_name) + '：</b>' + esc(r.summary) + '</div>' +
      (r.flags && r.flags.personal_info ? '<div class="warn">⚠ 本名や本当の連絡先らしきものが入っています。メールの中では「' + esc(S.persona) + '」の設定だけを使ってね。</div>' : '') +
      (r.flags && r.flags.injection ? '<div class="warn">⚠ 採点者への指示のような文が入っていたため、形式は0点になりました。</div>' : '') +
      '<div class="items">' + items + '</div>' +
      (r.tips.length ? '<h3 style="margin-top:16px">次に直すこと</h3><ol class="tips">' + r.tips.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ol>' : '') +
      mailBlock +
      '<div class="row" style="margin-top:20px">' +
        '<button class="btn leaf" id="btnCopy">📋 提出用テキストをコピー</button>' +
        (canRetry ? '<button class="btn primary" onclick="openStep(' + t.step + ')">直してもう一度送る</button>' : '') +
        '<button class="btn ghost" onclick="renderHome()">マップにもどる</button>' +
      '</div>' +
      '<p class="muted" style="margin-top:10px">コピーしたテキストを Moodle の課題に貼り付けて提出します。' + (canRetry ? '不合格でも提出はできますが、合格するまで挑戦しよう。' : '') + (!canRetry && !r.pass ? 'このステップの提出はこれで終わりです。指摘を次のステップに活かそう。' : '') + '</p>' +
      '<details><summary>提出用テキストを見る</summary><pre class="submit">' + esc(R.submitText) + '</pre></details>' +
    '</div>'
  );
  $('#btnCopy').onclick = () => copyText(R.submitText);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('コピーしました！Moodleに貼り付けて提出してね');
  } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('コピーしました！Moodleに貼り付けて提出してね'); } catch (e2) { toast('コピーできませんでした。下のテキストを選択してコピーしてね'); }
    document.body.removeChild(ta);
  }
}

// ============================================================
// 起動
// ============================================================
(async function init() {
  setTop();
  const saved = sstore('login');
  if (saved && saved.cls && saved.num) {
    try {
      const res = await api('login', saved);
      S.cls = saved.cls; S.num = saved.num;
      S.config = Object.assign({}, DEMO_CONFIG, res.config || {});
      S.tasks = res.tasks || []; S.progress = res.progress || {};
      S.persona = store('persona_' + S.cls + '_' + S.num);
      if (!S.persona) renderPersona(); else renderHome();
      return;
    } catch (e) { /* 失敗したらログイン画面へ */ }
  }
  renderLogin();
})();
</script>
</body>
</html>
